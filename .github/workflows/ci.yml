name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-xcode26.6-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-xcode26.6-

      - name: Build
        run: swift build -c release

      - name: Tests and performance budgets
        run: swift test

      - name: Bundle and sign
        run: make app

      - name: It has to actually launch
        run: |
          "./build/Diple (Dev).app/Contents/MacOS/Diple" > /tmp/launch.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 $pid 2>/dev/null; then
            echo "::error::the app did not survive 15 seconds"
            cat /tmp/launch.log
            ls ~/Library/Logs/DiagnosticReports/Diple*.ips 2>/dev/null | head -1 | xargs -r cat | head -60
            exit 1
          fi
          kill $pid
          echo "still up after 15s"

      - name: House rules
        run: |
          fail=0

          if grep -rn --include='*.swift' -E '^\s*//' Sources; then
            echo "::error::comments in the code — put it in NOTES.md or name it better"
            fail=1
          fi

          if grep -rn --include='*.swift' -iE '\b(nao|sim|entao|porque|arquivo|linha|tamanho|largura|altura|conteudo|aberto|fechado|aba|abas|fila|seguindo|revisando|esperando)\b' Sources; then
            echo "::error::Portuguese identifier in the code"
            fail=1
          fi

          exit $fail

  oldest-xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Use Xcode 26.0.1, the oldest the README supports
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-xcode26.0.1-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-xcode26.0.1-

      - name: Build
        run: swift build -c release

      - name: Tests
        run: swift test
