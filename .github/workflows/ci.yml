name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the newest Xcode on the runner
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build -c release

      - name: Tests and performance budgets
        run: swift test

      - name: Bundle and sign
        run: make app

      - name: It has to actually launch
        run: |
          "./build/Diple (Dev).app/Contents/MacOS/Diple" > /tmp/launch.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 $pid 2>/dev/null; then
            echo "::error::the app did not survive 15 seconds"
            cat /tmp/launch.log
            ls ~/Library/Logs/DiagnosticReports/Diple*.ips 2>/dev/null | head -1 | xargs -r cat | head -60
            exit 1
          fi
          kill $pid
          echo "still up after 15s"

      - name: House rules
        run: |
          fail=0

          if grep -rn --include='*.swift' -E '^\s*//' Sources; then
            echo "::error::comments in the code — put it in NOTES.md or name it better"
            fail=1
          fi

          if grep -rn --include='*.swift' -iE '\b(nao|sim|entao|porque|arquivo|linha|tamanho|largura|altura|conteudo|aberto|fechado|aba|abas|fila|seguindo|revisando|esperando)\b' Sources; then
            echo "::error::Portuguese identifier in the code"
            fail=1
          fi

          exit $fail
